[package]
name = "dvs-rpkg"
version = "0.3.0"
edition = "2024"
rust-version = '1.85'
publish = false

# Make this a standalone workspace (prevents inheriting from parent)
[workspace]

[lib]
name = "dvs"
path = "lib.rs"
crate-type = ["staticlib"]

[features]
default = []
nonapi = ["miniextendr-api/nonapi"]
connections = ["miniextendr-api/connections"]

[dependencies]
miniextendr-api = { version = "*", features = ["serde"] }
dvs = { path = "../../../dvs" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"

[build-dependencies]
miniextendr-lint = { version = "*" }

# codegen-units = 1 ensures the entire user crate compiles into a single .o file
# inside the staticlib archive. This is required for linkme's distributed_slice:
# the linker only pulls archive members that resolve undefined symbols, so with
# multiple .o files, distributed_slice entries in unreferenced .o files get dropped.
# With a single .o, pulling in R_init_<pkg> brings everything along.
[patch.crates-io]
miniextendr-api = { git = "https://github.com/CGMossa/miniextendr", rev = "3a9b1e2f" }
miniextendr-macros = { git = "https://github.com/CGMossa/miniextendr", rev = "3a9b1e2f" }
miniextendr-macros-core = { git = "https://github.com/CGMossa/miniextendr", rev = "3a9b1e2f" }
miniextendr-lint = { git = "https://github.com/CGMossa/miniextendr", rev = "3a9b1e2f" }

[profile.dev]
codegen-units = 1

[profile.release]
codegen-units = 1
