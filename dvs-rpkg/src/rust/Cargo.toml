[package]
name = "dvs-rpkg"
version = "0.3.0"
edition = "2024"
rust-version = '1.85'
publish = false

# Make this a standalone workspace (prevents inheriting from parent)
[workspace]

[lib]
name = "dvs"
path = "lib.rs"
crate-type = ["staticlib"]

[features]
default = []
nonapi = ["miniextendr-api/nonapi"]
connections = ["miniextendr-api/connections"]

# dvs is the in-repo core crate, depended on by path. Source and dev builds
# (`just rpkg-install`, devtools, install_github) compile the live `../../../dvs`,
# so the R package stays in sync with the core with no git pin to bump.
#
# For a shippable, offline tarball, `cargo revendor --freeze` (run by
# `just vendor` and by bootstrap.R before R CMD build) rewrites this path dep
# to `vendor/dvs` so the sealed tarball carries the core source and resolves
# without the monorepo. A path dep is not source-replaceable, which is why the
# tarball path needs freeze. The frozen Cargo.toml is never committed: `just
# vendor` consumers restore it after the build (see dvs-rpkg/tests/install-*).
#
# miniextendr stays a git dep. As an external framework crate it resolves
# offline via source replacement (vendor/.cargo-config.toml's
# `[source."git+<url>"]`), the form configure writes in tarball mode. freeze
# leaves it as git.
#
# Caveat: a consumer that extracts `dvs-rpkg/` alone with neither the `dvs`
# sibling nor a bundled inst/vendor.tar.xz (e.g. `rv sync` or a bare
# `install.packages()` of just the subdir) cannot source-build dvs.
# install_github (whole-repo) and tarball installs are unaffected.
[dependencies]
miniextendr-api = { git = "https://github.com/A2-ai/miniextendr", features = ["serde", "time", "log"] }
dvs = { path = "../../../dvs", package = "dvs" }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.149"
anyhow = "1.0.100"

[build-dependencies]
miniextendr-lint = { git = "https://github.com/A2-ai/miniextendr" }

[profile.dev]
codegen-units = 1

[profile.release]
codegen-units = 1
