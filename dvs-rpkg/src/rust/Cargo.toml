[package]
name = "dvs-rpkg"
version = "0.3.0"
edition = "2024"
rust-version = '1.85'
publish = false

# Make this a standalone workspace (prevents inheriting from parent)
[workspace]

[lib]
name = "dvs"
path = "lib.rs"
crate-type = ["staticlib"]

[features]
default = []
nonapi = ["miniextendr-api/nonapi"]
connections = ["miniextendr-api/connections"]

# Source-of-truth deps: git for both miniextendr and dvs.
#
# Both use git so the crate is resolvable when R extracts `dvs-rpkg/`
# alone into a tempdir (rv sync / install.packages() / remotes::install_github()),
# which does NOT bring sibling monorepo crates along. A path dep to
# `../../../dvs` fails `cargo metadata` in that context.
#
# `cargo revendor --freeze` rewrites these to vendor/ paths when packaging
# for CRAN. The frozen form is produced by `just vendor` and shipped in
# inst/vendor.tar.xz; never commit the frozen Cargo.toml itself.
#
# Monorepo dev iterating on local `dvs`: add an uncommitted
# `[patch."https://github.com/A2-ai/dvs2"] dvs = { path = "../../../dvs" }`
# block, or rely on `just` recipes that vendor from the local checkout.
[dependencies]
miniextendr-api = { git = "https://github.com/A2-ai/miniextendr", features = ["serde", "time"] }
dvs = { git = "https://github.com/A2-ai/dvs2", package = "dvs" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"

[build-dependencies]
miniextendr-lint = { git = "https://github.com/A2-ai/miniextendr" }

# TEMPORARY: local patches for unreleased upstream changes.
#
# 1. `miniextendr` — the `ColumnarDataFrame::with_column` method is on the
#    `feat/columnar-with-column` worktree; remove once that PR merges and
#    dvs-rpkg's miniextendr git rev pins a commit that includes it.
# 2. `dvs2` — `FileMetadata.add_time` as `jiff::Timestamp` lives on this
#    worktree's branch; remove once that PR merges and dvs-rpkg's dvs git
#    rev pins a commit that includes the type change.
[patch."https://github.com/A2-ai/miniextendr"]
miniextendr-api = { path = "/Users/elea/Documents/a2ai_github/dvs2/.miniextendr/.claude/worktrees/columnar-with-column/miniextendr-api" }
miniextendr-lint = { path = "/Users/elea/Documents/a2ai_github/dvs2/.miniextendr/.claude/worktrees/columnar-with-column/miniextendr-lint" }

[patch."https://github.com/A2-ai/dvs2"]
dvs = { path = "/Users/elea/Documents/a2ai_github/dvs2/.claude/worktrees/add-time-posixct/dvs" }

[profile.dev]
codegen-units = 1

[profile.release]
codegen-units = 1
