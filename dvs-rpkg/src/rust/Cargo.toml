[package]
name = "dvs-rpkg"
version = "0.5.1"
edition = "2024"
rust-version = '1.85'
publish = false

# An argument that fails the generated R checks or its conversion raises
# `dvs_error_argument` and `dvs_error` in front of miniextendr's classes, so
# one `dvs_error` handler catches it like the package's other errors.
[package.metadata.miniextendr]
conversion_error_class = ["dvs_error_argument", "dvs_error"]

# Make this a standalone workspace (prevents inheriting from parent)
[workspace]

[lib]
name = "dvs"
path = "lib.rs"
crate-type = ["staticlib"]

[features]
default = []
nonapi = ["miniextendr-api/nonapi"]
connections = ["miniextendr-api/connections"]

# dvs is the in-repo core crate, depended on by path. Builds in the checkout
# (`just rpkg-dev`, `just rpkg-install`, devtools) compile the live
# `../../../dvs`, so the R package stays in sync with the core with no pin.
#
# A tarball built by pkgbuild (devtools::build(), rv with `directory`) runs
# bootstrap.R first, which copies the core crate under src/rust/vendor/ and
# points this dependency there in the tarball, so it installs outside the
# monorepo. Plain `R CMD build` skips bootstrap.R, and its tarball does not
# install. `rv add dvs --path dvs-rpkg` hands over the subdirectory alone,
# and configure stops with a message that names the missing dependency.
#
# The release tarball (`just rpkg-build-tarball`) is the only build that
# vendors. `cargo revendor --freeze` rewrites this path dep to `vendor/dvs`,
# because a path dep is not source-replaceable, and minirextendr restores
# this file after the build. The frozen Cargo.toml is never committed.
#
# miniextendr stays a git dep, pinned by `rev`. Keep the `rev` of
# miniextendr-api and miniextendr-lint and the minirextendr `commit` in
# rproject.toml at the same commit (AGENTS.md, "Bump the miniextendr pin").
# As an external framework crate it resolves offline via source replacement
# (vendor/.cargo-config.toml's `[source."git+<url>"]`), the form configure
# writes in tarball mode. freeze leaves it as git.
[dependencies]
miniextendr-api = { git = "https://github.com/A2-ai/miniextendr", rev = "1c81fcd57cf0a7b4a0b9f44fa41fbb8f39d38d54", features = ["serde", "jiff", "log"] }
dvs = { path = "../../../dvs", package = "dvs" }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.149"
anyhow = "1.0.100"

[build-dependencies]
miniextendr-lint = { git = "https://github.com/A2-ai/miniextendr", rev = "1c81fcd57cf0a7b4a0b9f44fa41fbb8f39d38d54" }

[profile.dev]
codegen-units = 1

[profile.release]
codegen-units = 1
