name: ci
on:
  push:
    branches:
      - main
    paths-ignore:
      - "docs/**"
      - "README.md"
      - "ui/**"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "README.md"
      - "ui/**"

jobs:
  test:
    name: test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        build: [linux, macos, windows]
        include:
          - build: linux
            os: ubuntu-22.04
            rust: stable
          - build: macos
            os: macOS-latest
            rust: stable
          - build: windows
            os: windows-2022
            rust: stable
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}

      - name: Build System Info
        run: rustc --version

      - name: unpack rpkg vendor tarball
        run: tar -xJf dvs-rpkg/inst/vendor.tar.xz -C dvs-rpkg

      - name: check formatting
        run: |
          cargo fmt --all --check
          cargo fmt --manifest-path dvs-rpkg/src/rust/Cargo.toml -- --check

      - name: check with all features enabled
        run: |
          cargo check
          cargo check --all-features

      - name: run tests
        run: cargo test --all --all-features

      - name: check rpkg
        run: |
          cargo check --manifest-path dvs-rpkg/src/rust/Cargo.toml
          cargo check --manifest-path dvs-rpkg/src/rust/Cargo.toml --all-features
        env:
          R_HOME: /tmp
