name: ci
on:
  push:
    branches:
      - main
    paths-ignore:
      - "docs/**"
      - "README.md"
      - "ui/**"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "README.md"
      - "ui/**"

jobs:
  test:
    name: test
    runs-on: ${{ matrix.os }}
    strategy:
      # macOS and Windows are temporarily disabled; see #129 for re-enable
      # before the next release. To restore the full matrix, add `macos` and
      # `windows` back to `build:` and uncomment the two include blocks
      # below. The Windows --xz skip in the "Vendor rpkg deps" step is
      # retained so the matrix can be restored without extra surgery.
      matrix:
        build: [linux]
        # build: [linux, macos, windows]
        include:
          - build: linux
            os: ubuntu-22.04
            rust: stable
          # - build: macos
          #   os: macOS-latest
          #   rust: stable
          # - build: windows
          #   os: windows-2022
          #   rust: stable
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}

      - name: set global R_HOME
        shell: pwsh
        run: '"R_HOME=$env:RUNNER_TEMP" >> $env:GITHUB_ENV'

      - name: Build System Info
        run: rustc --version

      - name: Cache cargo-revendor
        id: revendor-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/cargo-revendor
            ~/.cargo/bin/cargo-revendor.exe
          key: ${{ runner.os }}-cargo-revendor-v1

      - name: Install cargo-revendor
        if: steps.revendor-cache.outputs.cache-hit != 'true'
        run: cargo install --git https://github.com/A2-ai/miniextendr cargo-revendor

      # Share the vendored output across the matrix. Key is OS-independent
      # (depends only on the source Cargo.toml + Cargo.lock), so the first
      # matrix job that finishes populates the cache for the others.
      - name: Cache rpkg vendor output
        id: rpkg-vendor-cache
        uses: actions/cache@v4
        with:
          path: |
            dvs-rpkg/vendor
            dvs-rpkg/src/rust/Cargo.toml
            dvs-rpkg/src/rust/Cargo.lock
            dvs-rpkg/inst/vendor.tar.xz
          key: rpkg-vendor-${{ hashFiles('dvs-rpkg/src/rust/Cargo.toml', 'dvs-rpkg/src/rust/Cargo.lock') }}

      - name: Vendor rpkg deps
        if: steps.rpkg-vendor-cache.outputs.cache-hit != 'true'
        shell: bash
        env:
          # Windows runners ship a BSD tar that lacks --xz; skip the tarball
          # there. The tarball is only shipped from linux/macos builds.
          COMPRESS_FLAG: ${{ runner.os == 'Windows' && ' ' || '--compress dvs-rpkg/inst/vendor.tar.xz' }}
        run: |
          cargo revendor \
            --manifest-path dvs-rpkg/src/rust/Cargo.toml \
            --output dvs-rpkg/vendor \
            --strip-all \
            --freeze \
            $COMPRESS_FLAG \
            --blank-md \
            --source-marker \
            --force \
            -v

      - name: check formatting
        run: |
          cargo fmt --all --check
          cargo fmt --manifest-path dvs-rpkg/src/rust/Cargo.toml -- --check

      - name: check with all features enabled
        run: |
          cargo check
          cargo check --all-features

      - name: run tests
        run: cargo test --all --all-features

      - name: check rpkg
        run: |
          cargo check --manifest-path dvs-rpkg/src/rust/Cargo.toml
          cargo check --manifest-path dvs-rpkg/src/rust/Cargo.toml --all-features
